version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: codenova_prod_pg
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-codenova_prod}
    networks:
      - codenova_net

  redis:
    image: redis:7-alpine
    container_name: codenova_prod_redis
    networks:
      - codenova_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codenova_prod_backend
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-codenova_prod}
      - JWT_SECRET=${JWT_SECRET:-prod_secret_key}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
    networks:
      - codenova_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codenova_prod_worker
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-codenova_prod}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres
      - redis
    networks:
      - codenova_net
    command: ["npm", "run", "worker"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codenova_prod_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - codenova_net

networks:
  codenova_net:
    driver: bridge
