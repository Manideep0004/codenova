apiVersion: apps/v1
kind: Deployment
metadata:
  name: codenova-worker
  namespace: production
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: 427282815124.dkr.ecr.ap-southeast-2.amazonaws.com/codenova-backend:latest
          command: ["npm", "run", "worker"]
          imagePullPolicy: Always
          env:
            - name: DOCKER_HOST
              value: "tcp://localhost:2375"
            - name: REDIS_HOST
              value: "redis-service"
            - name: REDIS_PORT
              value: "6379"
          envFrom:
            - configMapRef:
                name: codenova-config
            - secretRef:
                name: codenova-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

        - name: dind
          image: docker:24-dind
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: dind-storage
              mountPath: /var/lib/docker

      volumes:
        - name: dind-storage
          emptyDir: {}
